# Paste this service into your existing docker-compose.yml (same file as Immich /
# ImmichFrame), then `docker compose up -d --build immichframe-calendar`.
# No client secret and (by default) no Azure app registration are needed — the
# bridge defaults to Microsoft's first-party Graph CLI public client.
# To use your own app registration instead, uncomment CLIENT_ID below.

  immichframe-calendar:
    build: ./calendar-bridge
    container_name: immichframe-calendar
    restart: unless-stopped
    environment:
      # CLIENT_ID: "<your-own-app-client-id>"   # optional; omit to use the default
      TZ: "Australia/Perth"
      # Optional overrides:
      # LOOKAHEAD_DAYS: "90"
      # COUNT: "3"
      # REFRESH_MINUTES: "15"
      # PORT: "8099"
    volumes:
      - immichframe-cal-data:/data
    ports:
      - "8099:8099"

# And add this under the top-level `volumes:` key of the compose file:
#   immichframe-cal-data:
